# Global Agent Settings
[agent]
  interval = "10s"
  flush_interval = "10s"

# --- INPUT: MQTT Consumer ---
[[inputs.mqtt_consumer]]
  # Connect to the Mosquitto container running in Docker
  servers = ["YOUR_MQTT_SERVER"]
  
  # The topic the ESP32 will publish to
  topics = [ "home/energy/power" ]

  # How to interpret the incoming data
  data_format = "json"

# --- OUTPUT: InfluxDB v2 ---
[[outputs.influxdb_v2]]
  # Send data to the InfluxDB container running in Docker
  urls = ["YOUR_INFLUXDB_URL"]

  # Authentication details from the docker-compose.yml file
  token = "my-super-secret-token"
  organization = "my-org"
  bucket = "home_energy"